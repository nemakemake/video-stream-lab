; Freenove ESP32-S3-WROOM CAM (модуль с 8MB OPI PSRAM, OV5640/OV2640)
; Framework: Arduino-ESP32 — драйвер камеры (esp_camera.h) идёт в комплекте,
; отдельно ставить esp32-camera не нужно.

[env:freenove_esp32_s3_cam]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

monitor_speed = 115200
upload_speed = 921600

; Freenove ESP32-S3-WROOM использует модуль с OPI PSRAM (8MB) —
; без этих флагов esp_camera_init() будет падать с ENOMEM на кадрах крупнее QVGA.
board_build.psram_type = opi
board_build.arduino.memory_type = qio_opi
build_flags =
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue

; Прошивка с камерой+Wi-Fi не влезает в дефолтную партиционную таблицу —
; используем схему с большим app-разделом.
board_build.partitions = huge_app.csv
